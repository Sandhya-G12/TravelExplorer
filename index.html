<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Travel Explorer</h1>
    <p>Type a place and see photos and weather!</p>

    <input type="text" id="destination" placeholder="Enter a place">
    <button id="search">Explore</button>

    <div id="photo"></div>
    <div id="weather"></div>

    <script src="script.js"></script>
    <!-- Load the config file first so your keys are available -->
<script src="config.js"></script>

<!-- Then load your main script -->
<script src="script.js"></script>

</body>
</html>
